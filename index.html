<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Wallace OS</title>
<meta name="theme-color" content="#05050d"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Wallace OS"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Cabinet+Grotesk:wght@500;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05050d;--sur:#0a0a18;--sur2:#0f0f1f;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);
  --text:#e2e2f0;--muted:#3a3a5a;--muted2:#606088;
  --claude:#818cf8;--gemini:#34d399;--warn:#fb923c;--danger:#f87171;
  --fd:'Cabinet Grotesk',sans-serif;--fm:'DM Mono',monospace;
}
body{background:var(--bg);font-family:'Cabinet Grotesk',sans-serif;color:var(--text);min-height:100vh;overflow:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#1a1a30;border-radius:3px}

/* SHELL */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--border);background:rgba(5,5,13,0.95);backdrop-filter:blur(12px);flex-shrink:0;gap:10px}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-title{font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.engine-pill{font-family:'DM Mono',monospace;font-size:0.52rem;padding:3px 8px;border-radius:20px;border:1px solid;white-space:nowrap;flex-shrink:0}
.engine-pill.claude{color:var(--claude);border-color:rgba(129,140,248,0.3);background:rgba(129,140,248,0.08)}
.engine-pill.gemini{color:var(--gemini);border-color:rgba(52,211,153,0.3);background:rgba(52,211,153,0.08)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sync-indicator{font-family:'DM Mono',monospace;font-size:0.55rem}
.sync-ok{color:var(--gemini)}.sync-err{color:var(--warn)}.sync-ing{color:var(--muted);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.user-name{font-family:'DM Mono',monospace;font-size:0.6rem;color:#505070}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}

/* BOTTOM NAV */
.bottom-nav{display:flex;border-top:1px solid var(--border);background:rgba(5,5,13,0.97);padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom));flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#3a3a5a;font-family:'DM Mono',monospace;font-size:0.45rem;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;padding:6px 2px;transition:color 0.18s;-webkit-tap-highlight-color:transparent}
.nav-btn.active{color:var(--claude)}
.nav-btn .ni{font-size:1.1rem;line-height:1}

/* PAGES */
.page{padding:20px 18px;padding-bottom:20px;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.greeting{font-size:1.9rem;font-weight:900;letter-spacing:-0.03em;line-height:1.1;margin-bottom:4px}
.greeting span{background:linear-gradient(135deg,#fff,var(--claude));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.home-sub{font-family:'DM Mono',monospace;font-size:0.65rem;color:#404060;margin-bottom:24px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat{background:var(--sur);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-val{font-size:1.5rem;font-weight:900;letter-spacing:-0.02em}
.stat-lbl{font-family:'DM Mono',monospace;font-size:0.55rem;color:#404060;text-transform:uppercase;letter-spacing:0.07em;margin-top:2px}
.section-lbl{font-family:'DM Mono',monospace;font-size:0.58rem;color:#404060;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px}
.mod-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.mod-card{background:var(--sur);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;text-align:left;width:100%;color:var(--text);font-family:'Cabinet Grotesk',sans-serif;display:flex;align-items:center;gap:14px;transition:all 0.18s;-webkit-tap-highlight-color:transparent}
.mod-card:active{background:var(--sur2);transform:scale(0.98)}
.mod-icon{font-size:1.4rem;flex-shrink:0}
.mod-info{flex:1;min-width:0}
.mod-name{font-size:0.92rem;font-weight:700;margin-bottom:2px}
.mod-desc{font-family:'DM Mono',monospace;font-size:0.6rem;color:#404060;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-tag{font-family:'DM Mono',monospace;font-size:0.48rem;padding:2px 6px;border-radius:4px;border:1px solid;flex-shrink:0}
.mod-tag.claude{color:var(--claude);border-color:rgba(129,140,248,0.25)}
.mod-tag.gemini{color:var(--gemini);border-color:rgba(52,211,153,0.25)}
.recent-card{background:var(--sur);border:1px solid var(--border);border-radius:12px;padding:16px}
.recent-title{font-size:0.85rem;font-weight:700;margin-bottom:12px}
.history-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
.history-row:last-child{border-bottom:none}
.h-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.h-body{flex:1;min-width:0}
.h-mod{font-family:'DM Mono',monospace;font-size:0.54rem;color:#404060;text-transform:uppercase;margin-bottom:2px}
.h-text{font-size:0.8rem;color:#8080a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-time{font-family:'DM Mono',monospace;font-size:0.54rem;color:#404060;flex-shrink:0}
.empty-msg{font-family:'DM Mono',monospace;font-size:0.7rem;color:#404060;text-align:center;padding:20px 0}

/* CHAT */
.chat-page{display:flex;flex-direction:column;height:100%;overflow:hidden}
.chat-ctx{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.chat-ctx::-webkit-scrollbar{display:none}
.ctx-chip{font-family:'DM Mono',monospace;font-size:0.55rem;padding:3px 9px;border-radius:6px;border:1px solid var(--border);color:#404060;white-space:nowrap;background:rgba(255,255,255,0.02)}
.ctx-chip.on{border-color:rgba(129,140,248,0.3);color:var(--claude)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.empty-chat{margin:auto;text-align:center;padding:30px 16px}
.ec-icon{font-size:2.5rem;margin-bottom:12px}
.ec-title{font-size:1.1rem;font-weight:800;margin-bottom:6px}
.ec-sub{font-family:'DM Mono',monospace;font-size:0.65rem;color:#404060;margin-bottom:16px;line-height:1.6}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pill{background:var(--sur2);border:1px solid var(--border2);border-radius:20px;padding:6px 12px;font-size:0.75rem;cursor:pointer;color:#8080a0;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.pill:active{border-color:var(--claude);color:var(--claude)}
.msg{display:flex;flex-direction:column;gap:4px;max-width:88%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start}
.msg-who{font-family:'DM Mono',monospace;font-size:0.54rem;color:#404060;padding:0 3px}
.msg-body{border-radius:12px;padding:12px 15px;font-size:0.87rem;line-height:1.7;border:1px solid}
.msg.user .msg-body{background:rgba(255,255,255,0.06);border-color:var(--border2);border-bottom-right-radius:3px}
.msg.ai .msg-body{background:var(--sur);border-color:var(--border);border-bottom-left-radius:3px;border-left-width:2px}
.msg-acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.act-btn{background:none;border:1px solid var(--border);color:#505070;padding:4px 9px;border-radius:6px;font-family:'DM Mono',monospace;font-size:0.55rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
.act-btn:active{border-color:var(--border2);color:var(--text)}
.dots-wrap{display:flex;gap:4px;align-items:center;padding:4px 0}
.dots-wrap span{width:5px;height:5px;border-radius:50%;animation:bounce 1.2s infinite}
.dots-wrap span:nth-child(2){animation-delay:.18s}
.dots-wrap span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
.file-out{background:rgba(52,211,153,0.06);border:1px solid rgba(52,211,153,0.2);border-radius:8px;padding:10px 14px;margin-top:8px;display:flex;align-items:center;gap:10px}
.file-name{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--gemini);flex:1}
.dl-btn{background:var(--gemini);color:#05050d;border:none;border-radius:7px;padding:6px 12px;font-family:'DM Mono',monospace;font-size:0.62rem;cursor:pointer;white-space:nowrap}
.input-area{padding:10px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--border);background:rgba(5,5,13,0.95);flex-shrink:0}
.input-tools{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.input-tools::-webkit-scrollbar{display:none}
.tool-btn{background:none;border:1px solid var(--border);color:#505070;padding:5px 10px;border-radius:7px;font-family:'DM Mono',monospace;font-size:0.56rem;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.tool-btn.on{border-color:rgba(129,140,248,0.4);color:var(--claude);background:rgba(129,140,248,0.06)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.chat-ta{flex:1;background:var(--sur);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:'Cabinet Grotesk',sans-serif;font-size:0.88rem;padding:11px 13px;resize:none;outline:none;transition:border-color 0.2s;line-height:1.5;max-height:100px}
.chat-ta:focus{border-color:var(--claude)}
.chat-ta::placeholder{color:#303050}
.send-btn{width:44px;height:44px;border-radius:10px;border:none;font-size:1.1rem;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:all 0.18s}
.send-btn:disabled{opacity:.25;cursor:not-allowed}

/* PROFILE & CONFIG */
.form-card{background:var(--sur);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.form-label{font-family:'DM Mono',monospace;font-size:0.58rem;color:#404060;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:7px}
.form-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;padding:10px 12px;outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--claude)}
.form-ta{resize:vertical;min-height:80px;line-height:1.5}
.save-btn{background:var(--claude);color:#05050d;border:none;border-radius:10px;padding:12px 24px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;margin-top:8px;width:100%;-webkit-tap-highlight-color:transparent}
.key-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.key-status{font-family:'DM Mono',monospace;font-size:0.55rem;padding:3px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.key-ok{color:var(--gemini);border-color:rgba(52,211,153,0.3);background:rgba(52,211,153,0.06)}
.key-no{color:#404060;border-color:var(--border)}
.cost-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;font-size:0.68rem}
.cost-row:last-child{border-bottom:none}

/* MEMORY */
.mem-card{background:var(--sur);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
.mem-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mem-mod{font-family:'DM Mono',monospace;font-size:0.55rem;color:#404060;text-transform:uppercase}
.mem-time{font-family:'DM Mono',monospace;font-size:0.55rem;color:#404060}
.mem-text{font-size:0.8rem;color:#8080a0;line-height:1.5}
.del-btn{background:none;border:none;color:#404060;cursor:pointer;font-size:0.8rem;padding:2px 6px}

/* MODAL / ONBOARD */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal{background:var(--sur);border:1px solid var(--border2);border-radius:18px;padding:30px 24px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:1.3rem;font-weight:900;margin-bottom:6px}
.modal-sub{font-family:'DM Mono',monospace;font-size:0.65rem;color:#606080;line-height:1.7;margin-bottom:22px}
.modal-label{font-family:'DM Mono',monospace;font-size:0.58rem;color:#606080;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;margin-top:14px;display:flex;align-items:center;gap:7px}
.modal-input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.8rem;padding:11px 13px;outline:none;transition:border-color 0.2s;margin-bottom:4px}
.modal-input:focus{border-color:var(--claude)}
.modal-btn{width:100%;background:var(--claude);color:#05050d;border:none;border-radius:10px;padding:13px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.95rem;font-weight:800;cursor:pointer;margin-top:12px}
.modal-links{display:flex;gap:16px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.modal-link{font-family:'DM Mono',monospace;font-size:0.58rem;color:#404060}
.modal-link a{color:#606080;text-decoration:none}
.modal-skip{background:none;border:none;color:#404060;font-family:'DM Mono',monospace;font-size:0.58rem;cursor:pointer;width:100%;text-align:center;margin-top:8px;padding:6px;text-transform:uppercase;letter-spacing:0.05em}

/* PAGE TITLE */
.page-title{font-size:1.4rem;font-weight:900;margin-bottom:4px}
.page-sub{font-family:'DM Mono',monospace;font-size:0.65rem;color:#404060;margin-bottom:20px}

/* HELPERS */
.msg-body strong{color:#fff}.msg-body em{color:#bbb}
.mh{font-weight:800;font-size:0.93rem;margin:8px 0 3px;color:#fff;display:block}
.mb{padding:2px 0;color:#aaa;display:block}
</style>
</head>
<body>
<div class="shell" id="app">
  <div class="topbar" id="topbar">
    <div class="topbar-left">
      <span class="topbar-title" id="topbar-title">Wallace OS</span>
      <span class="engine-pill" id="engine-pill" style="display:none"></span>
    </div>
    <div class="topbar-right">
      <span class="sync-indicator" id="sync-ind"></span>
      <span class="user-name" id="user-name"></span>
    </div>
  </div>
  <div class="content" id="content"></div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
// ── TEMPLATE RELATÓRIO NOV ────────────────────────────────────────────────
const RELATORIO_CSS=`:root{--bg:#0A0A0C;--bg2:#0F0F12;--bg3:#141418;--bg4:#1A1A1F;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--border3:rgba(255,255,255,.04);--champagne:#C8A96A;--champ2:#D8BC88;--champ-dim:rgba(200,169,106,.10);--silver:#9AAABB;--silver2:#B8C8D4;--pos:#4A9A70;--pos-dim:rgba(74,154,112,.12);--warn:#B87A38;--warn-dim:rgba(184,122,56,.12);--neg:#A04040;--neg-dim:rgba(160,64,64,.12);--t-primary:#E8EAF0;--t-secondary:#8A9AB0;--t-muted:#4A5668;--t-label:#6A7A8C;--font:'Segoe UI','Helvetica Neue',Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:var(--font);background:var(--bg);color:var(--t-primary);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
.hdr{background:linear-gradient(180deg,#0A0A0D 0%,#0F0F14 100%);border-bottom:1px solid var(--border2);position:relative}.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--champagne),var(--silver),transparent);opacity:.5}.hdr-accent{height:2px;background:linear-gradient(90deg,transparent 0%,var(--champagne) 30%,var(--silver2) 60%,transparent 100%)}.hdr-top{display:flex;align-items:center;gap:20px;padding:18px 36px;flex-wrap:wrap}.logo-box{height:44px;flex-shrink:0;border-radius:3px;background:linear-gradient(135deg,rgba(200,169,106,.18),rgba(154,170,187,.08));border:1px solid rgba(200,169,106,.3);display:flex;align-items:center;justify-content:center;padding:0 18px;font-size:18px;font-weight:800;letter-spacing:3px;color:var(--champagne)}.hdr-divider{width:1px;height:44px;background:var(--border2);flex-shrink:0}.hdr-info{flex:1}.hdr-info h1{font-size:15px;font-weight:600;color:var(--t-primary);letter-spacing:.8px;text-transform:uppercase}.hdr-info .sub{font-size:11px;color:var(--t-secondary);margin-top:5px;line-height:1.7;display:flex;gap:14px;flex-wrap:wrap}.hdr-info .sub span::before{content:'·';margin-right:6px;color:var(--t-muted)}.hdr-info .sub span:first-child::before{display:none}.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(200,169,106,.3);border-radius:2px;padding:1px 7px;font-size:10px;color:var(--champagne);font-weight:600;background:var(--champ-dim);letter-spacing:.3px}.pill.blue{border-color:rgba(106,142,192,.3);color:#8AAEDC;background:rgba(106,142,192,.08)}.pill.green{border-color:rgba(74,154,112,.3);color:#6EC090;background:rgba(74,154,112,.08)}.pill.red{border-color:rgba(160,64,64,.3);color:#D07070;background:rgba(160,64,64,.08)}.hdr-right{text-align:right;font-size:10px;color:var(--t-muted);line-height:2}.hdr-right .name{color:var(--t-secondary);font-weight:600;font-size:11px}.hdr-meta{background:rgba(255,255,255,.018);border-top:1px solid var(--border3);padding:9px 36px;display:flex;gap:24px;flex-wrap:wrap;font-size:10.5px;color:var(--t-muted)}.hdr-meta b{color:var(--t-secondary);font-weight:600}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 36px;display:flex;flex-wrap:wrap;position:sticky;top:0;z-index:100}.nb{padding:12px 15px;background:none;border:none;border-bottom:1px solid transparent;color:var(--t-muted);cursor:pointer;font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:all .2s;white-space:nowrap}.nb:hover{color:var(--t-secondary)}.nb.on{color:var(--champagne);border-bottom-color:var(--champagne)}.nb.hl{color:var(--pos)}
.main{padding:22px 36px;max-width:1700px;margin:0 auto}.pg{display:none}.pg.on{display:block}

// ── SHEETS SYNC ───────────────────────────────────────────────────────────
const Sheets={
  async req(path,method='GET',body){
    const url=`${SHEETS_BASE}${path}${path.includes('?')?'&':'?'}key=${SHEETS_KEY}`;
    const opts={method,headers:{'Content-Type':'application/json'}};
    if(body)opts.body=JSON.stringify(body);
    const r=await fetch(url,opts);
    return r.json();
  },
  async ensureTab(name){
    const d=await this.req('');
    if(!d.sheets?.some(s=>s.properties.title===name)){
      await this.req(':batchUpdate','POST',{requests:[{addSheet:{properties:{title:name}}}]});
    }
  },
  async write(tab,rows){
    await this.ensureTab(tab);
    await this.req(`/values/${encodeURIComponent(tab)}?valueInputOption=RAW`,'PUT',{range:tab,majorDimension:'ROWS',values:rows});
  },
  async append(tab,row){
    await this.ensureTab(tab);
    await this.req(`/values/${encodeURIComponent(tab)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,'POST',{range:tab,majorDimension:'ROWS',values:[row]});
  },
  async read(tab){
    const d=await this.req(`/values/${encodeURIComponent(tab)}`);
    return d.values||[];
  },
  async syncProfile(p){
    await this.write('perfil',[['chave','valor'],...Object.entries(p).map(([k,v])=>[k,String(v||'')])]);
  },
  async loadProfile(){
    const rows=await this.read('perfil');
    if(rows.length<2)return null;
    const o={};rows.slice(1).forEach(([k,v])=>{if(k)o[k]=v||''});return o;
  },
  async appendHistory(e){
    await this.append('historico',[String(e.ts),e.module,e.summary.replace(/\n/g,' '),(e.response||'').replace(/\n/g,' '),new Date(e.ts).toLocaleString('pt-BR')]);
  },
  async loadHistory(){
    const rows=await this.read('historico');
    return rows.filter(r=>r[0]&&!isNaN(+r[0])).map(r=>({ts:+r[0],module:r[1]||'',summary:r[2]||'',response:r[3]||''}));
  },
  async deleteHistory(ts){
    const rows=await this.read('historico');
    const f=rows.filter(r=>String(r[0])!==String(ts));
    await this.write('historico',f.length?f:[['ts','module','summary','response','data']]);
  }
};

async function syncLoad(){
  setSyncStatus('syncing');
  try{
    const [rp,rh]=await Promise.all([Sheets.loadProfile(),Sheets.loadHistory()]);
    if(rp&&Object.keys(rp).length){
      const m={...(S.get('wos_profile')||{}),...rp};
      state.profile=m;S.set('wos_profile',m);
    }
    if(rh&&rh.length){
      const local=S.get('wos_history')||[];
      const ts=new Set(local.map(x=>x.ts));
      const merged=[...local,...rh.filter(x=>!ts.has(x.ts))].slice(-200).sort((a,b)=>a.ts-b.ts);
      state.history=merged;S.set('wos_history',merged);
    }
    setSyncStatus('synced');
    renderPage();
  }catch(e){setSyncStatus('error')}
}

function setSyncStatus(s){
  state.syncStatus=s;
  const el=document.getElementById('sync-ind');
  if(!el)return;
  if(s==='syncing'){el.className='sync-indicator sync-ing';el.textContent='◈ sync'}
  else if(s==='synced'){el.className='sync-indicator sync-ok';el.textContent='✓ sync'}
  else if(s==='error'){el.className='sync-indicator sync-err';el.textContent='⚠ offline'}
  else{el.className='sync-indicator';el.textContent=''}
}

// ── API CALLERS ───────────────────────────────────────────────────────────
async function callClaude(msgs,sys,key){
  const r=await fetch('/api/claude',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:msgs,system:sys,key}),
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.content?.[0]?.text||'Sem resposta.';
}

async function callGemini(msgs,sys,key){
  const contents=msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  const r=await fetch('/api/gemini',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents,system_instruction:{parts:[{text:sys}]},key}),
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'Sem resposta.';
}

function makeCSV(title,content){
  function parseLine(l){
    const clean=l.replace(/[*#►▸◈]/g,'').trim();
    if(clean.startsWith('|')&&clean.endsWith('|')){
      const cells=clean.slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^[-:\s]+$/.test(c)))return null;
      return cells;
    }
    return[clean];
  }
  const rows=[['Wallace OS — '+title],['Gerado em',new Date().toLocaleString('pt-BR')],[''],
    ...content.split('\n').filter(l=>l.trim()).map(parseLine).filter(Boolean)];
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  return{blob:new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),name:title.replace(/\s+/g,'_')+'.csv'};
}
function makeHTML(title,content){
  const body=content.split('\n').map(l=>{
    if(l.startsWith('## '))return`<h2>${l.slice(3)}</h2>`;
    if(l.startsWith('# '))return`<h1>${l.slice(2)}</h1>`;
    if(l.startsWith('- '))return`<li>${l.slice(2)}</li>`;
    if(l.trim()==='')return'<br/>';
    return`<p>${l}</p>`;
  }).join('\n');
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><title>${title}</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 24px;line-height:1.7;color:#1a1a2e}h1,h2{color:#2d2d6a}p{margin:6px 0}li{margin:4px 0}</style></head><body><h1>${title}</h1><p style="color:#888;font-size:.85rem">Gerado por Wallace OS · ${new Date().toLocaleString('pt-BR')}</p>${body}</body></html>`;
  return{blob:new Blob([html],{type:'text/html;charset=utf-8'}),name:title.replace(/\s+/g,'_')+'.html'};
}

// ── FORMAT ────────────────────────────────────────────────────────────────
function fmt(text){
  let t=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // extract markdown tables before line-level transforms
  const tbls=[];
  t=t.replace(/((?:^|\n)\|.+(?:\n\|.+)+)/g,(blk)=>{
    const rows=blk.trim().split('\n').filter(r=>r.trim().startsWith('|'));
    const sepIdx=rows.findIndex(r=>/^[\|\s\-:]+$/.test(r));
    let h='<div style="overflow-x:auto;margin:8px 0"><table style="border-collapse:collapse;width:100%;font-size:0.82rem">';
    rows.forEach((row,i)=>{
      if(i===sepIdx)return;
      const cells=row.split('|').slice(1,-1).map(c=>c.trim());
      if(i<(sepIdx>0?sepIdx:1)){
        h+='<thead><tr>'+cells.map(c=>`<th style="padding:6px 10px;border:1px solid rgba(255,255,255,0.1);text-align:left;font-weight:700;color:#fff;background:rgba(255,255,255,0.05);white-space:nowrap">${c}</th>`).join('')+'</tr></thead>';
      } else {
        h+='<tr>'+cells.map(c=>`<td style="padding:6px 10px;border:1px solid rgba(255,255,255,0.07)">${c}</td>`).join('')+'</tr>';
      }
    });
    h+='</table></div>';
    tbls.push(h);
    return`\n__TBL${tbls.length-1}__\n`;
  });
  t=t
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^#{1,3}\s(.+)$/gm,'<span class="mh">$1</span>')
    .replace(/^[-•]\s(.+)$/gm,'<span class="mb">▸ $1</span>')
    .replace(/\n\n/g,'<br/><br/>').replace(/\n/g,'<br/>');
  t=t.replace(/__TBL(\d+)__/g,(_,i)=>tbls[+i]);
  return t;
}
function timeAgo(ts){
  const d=(Date.now()-ts)/1000;
  if(d<60)return'agora';if(d<3600)return Math.floor(d/60)+'m';
  if(d<86400)return Math.floor(d/3600)+'h';
  return new Date(ts).toLocaleDateString('pt-BR');
}

async function doSend(text,mod){
  const msgs=state.chats[mod.id]||[];
  let fullText=text;
  if(state.attachedFile){
    fullText=`[DOCUMENTO ANEXADO: ${state.attachedFile.name}]\n${state.attachedFile.content}\n[/DOCUMENTO ANEXADO]\n\n${text}`;
    state.attachedFile=null;
    renderPage();

  state.chats[mod.id]=newMsgs;
  S.set('chat_'+mod.id,newMsgs.slice(-30));
  // show user msg + loading
  renderPage();
  scrollBottom();
  // add loading indicator
  const msgsArea=document.getElementById('msgs-area');
  if(msgsArea){
    const loadDiv=document.createElement('div');
    loadDiv.className='msg ai';loadDiv.id='loading-msg';
    loadDiv.innerHTML=`<div class="msg-who">${mod.engine==='claude'?'Claude Sonnet':'Gemini Flash'}</div><div class="msg-body" style="border-left-color:${mod.color}"><div class="dots-wrap"><span style="background:${mod.color}"></span><span style="background:${mod.color}"></span><span style="background:${mod.color}"></span></div></div>`;
    msgsArea.insertBefore(loadDiv,document.getElementById('msgs-bottom'));
    scrollBottom();
  }
  try{
    const key=mod.engine==='claude'?state.keys.claudeKey:state.keys.geminiKey;
    const sys=getPrompt(mod.id);
    let reply;
    if(mod.engine==='claude')reply=await callClaude(newMsgs,sys,key);
    else reply=await callGemini(newMsgs,sys,key);

    // detect file gen commands
    let fileObj=null;
    if(reply.includes('[GERAR_RELATORIO:')){
      const t=reply.match(/\[GERAR_RELATORIO:\s*(.+?)\]/)?.[1]||'Relatório NOV';
      const body=reply.replace(/\[GERAR_RELATORIO:[^\]]+\]/g,'').trim();
      fileObj=makeRelatorioHTML(t,body);
    } else if(reply.includes('[GERAR_CSV:')){
      const t=reply.match(/\[GERAR_CSV:\s*(.+?)\]/)?.[1]||'Relatório';
      fileObj=makeCSV(t,reply.replace(/\[GERAR_CSV:[^\]]+\]/g,''));
    } else if(reply.includes('[GERAR_HTML:')){
      const t=reply.match(/\[GERAR_HTML:\s*(.+?)\]/)?.[1]||'Documento';
      fileObj=makeHTML(t,reply.replace(/\[GERAR_HTML:[^\]]+\]/g,''));
    }
    const clean=reply.replace(/\[(GERAR_RELATORIO|GERAR_CSV|GERAR_HTML):[^\]]+\]/g,'').trim();
    const finalMsgs=[...newMsgs,{role:'assistant',content:clean}];
    state.chats[mod.id]=finalMsgs;
    S.set('chat_'+mod.id,finalMsgs.slice(-30));
    const idx=finalMsgs.length-1;
    if(fileObj)pendingFiles[mod.id+'_'+idx]=fileObj;

    // save history
    const entry={ts:Date.now(),module:mod.id,summary:text.slice(0,120),response:clean.slice(0,200)};
    state.history=[...state.history,entry].slice(-200);
    S.set('wos_history',state.history);
    Sheets.appendHistory(entry).catch(()=>{});

  }catch(e){
    const errMsgs=[...newMsgs,{role:'assistant',content:`⚠ Erro: ${e.message}`}];
    state.chats[mod.id]=errMsgs;
    S.set('chat_'+mod.id,errMsgs.slice(-30));
  }
  renderPage();scrollBottom();
}

function scrollBottom(){
  setTimeout(()=>{
    const b=document.getElementById('msgs-bottom');
    if(b)b.scrollIntoView({behavior:'smooth'});
  },100);
}

function copyText(i){
  const mod=MODULES.find(m=>m.id===state.activeMod);
  const msgs=state.chats[mod.id]||[];
  const aiMsgs=msgs.filter(m=>m.role==='assistant');
  const msg=aiMsgs[Math.floor(i/2)]||msgs[i];
  if(msg)navigator.clipboard.writeText(msg.content).catch(()=>{});
}

function detailMsg(i){
  const ta=document.getElementById('chat-input');
  if(ta)ta.value='Aprofunde e seja mais detalhado na resposta anterior.';
}

function dlFile(key){
  if(pendingFiles[key])downloadFile(pendingFiles[key]);
}

function genFile(){
  const ta=document.getElementById('chat-input');
  if(ta)ta.value='Com base no que discutimos, gere um documento completo para baixar.';
}

function attachFile(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    state.attachedFile={name:file.name,content:e.target.result};
    renderPage();
    const ta=document.getElementById('chat-input');
    if(ta&&!ta.value)ta.value=state.activeMod==='financas'?'Analise este documento financeiro e detalhe os valores, categorias e saldo total em formato brasileiro (R$ 1.234,56).':'Analise este documento e gere o relatório executivo completo no template NOV.';
  };
  reader.readAsText(file,'UTF-8');
}

// ── MEMORIA ───────────────────────────────────────────────────────────────
function renderMemoria(){
  const byMod={};
  state.history.forEach(h=>{
    if(!byMod[h.module])byMod[h.module]=[];
    byMod[h.module].push(h);
  });
  return`<div class="page">
    <div class="page-title">◈ Memória</div>
    <div class="page-sub">${state.history.length} entradas · salvas localmente e no Sheets</div>
    ${state.history.length===0?'<div class="empty-msg">Nenhuma memória ainda.</div>':
      Object.entries(byMod).map(([modId,items])=>{
        const mod=MODULES.find(m=>m.id===modId);
        return`<div style="margin-bottom:20px">
          <div class="section-lbl" style="margin-bottom:8px">${mod?.icon||''} ${mod?.label||modId} (${items.length})</div>
          ${items.slice().reverse().map(h=>`
            <div class="mem-card">
              <div class="mem-head">
                <span class="mem-mod">${new Date(h.ts).toLocaleString('pt-BR')}</span>
                <button class="del-btn" onclick="delHistory(${h.ts})">✕</button>
              </div>
              <div class="mem-text"><strong>Você:</strong> ${h.summary}</div>
              ${h.response?`<div class="mem-text" style="opacity:.7;margin-top:4px"><strong>IA:</strong> ${h.response}</div>`:''}
            </div>
          `).join('')}
        </div>`;
      }).join('')
    }
  </div>`;
}

function delHistory(ts){
  state.history=state.history.filter(h=>h.ts!==ts);
  S.set('wos_history',state.history);
  Sheets.deleteHistory(ts).catch(()=>{});
  renderPage();
}

  return`<div class="page">
    <div class="page-title">◉ Perfil</div>
    <div class="page-sub">Quanto mais completo, mais personalizado o segundo cérebro</div>
    ${[
      {k:'name',label:'Nome',ph:'Wallace Morais',ta:false},

      {k:'saasContext',label:'Contexto do SaaS',ph:'Estágio atual, clientes, desafios, próximos passos...',ta:true},
    ].map(f=>`
      <div class="form-card">

function savePerfil(){
  const p={};
  ['name','role','englishLevel','goals','financialContext','saasContext'].forEach(k=>{
    const el=document.getElementById('pf_'+k);
    if(el)p[k]=el.value;
  });
  state.profile=p;S.set('wos_profile',p);
  document.getElementById('user-name').textContent=p.name||'';
  Sheets.syncProfile(p)
    .then(()=>alert('Perfil salvo e sincronizado! ✓'))
    .catch(()=>alert('Perfil salvo localmente.'));
}

  overlay.innerHTML=`<div class="modal">
    <div class="modal-title">Bem-vindo ao Wallace OS</div>
    <div class="modal-sub">Seu segundo cérebro com IA híbrida.<br/>Lembra de tudo. Gera arquivos. Evolui com você.</div>
    <div class="modal-label">Como devo te chamar?</div>
    <input class="modal-input" id="ob_name" placeholder="Seu nome..." />

    <input class="modal-input" id="ob_claude" type="password" placeholder="sk-ant-..." />

function finishOnboard(){
  const name=document.getElementById('ob_name')?.value||'';
  const ck=document.getElementById('ob_claude')?.value||'';
  const gk=document.getElementById('ob_gemini')?.value||'';
  if(name){state.profile={...state.profile,name};S.set('wos_profile',state.profile);}
  if(ck||gk){state.keys={claudeKey:ck,geminiKey:gk};S.set('wos_keys',state.keys);}
  S.set('wos_initialized',true);
  state.firstRun=false;
  document.getElementById('onboard')?.remove();
  document.getElementById('user-name').textContent=name||'';
  if(name)Sheets.syncProfile(state.profile).catch(()=>{});
  syncLoad();
}

function attachListeners(){

  if(ta){
    ta.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
    });
  }
}
